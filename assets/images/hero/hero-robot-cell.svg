<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Line drawing of a six-axis industrial robot arm gripping a part at a workcell fixture">
  <style>
    .ln { stroke: #F5F5F0; stroke-width: 1.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .body { fill: #1F2427; stroke: #F5F5F0; stroke-width: 1.6; stroke-linejoin: round; }
    .thin { stroke: #6C7377; stroke-width: 1; fill: none; }
    .dash { stroke: #6C7377; stroke-width: 1; stroke-dasharray: 4 5; fill: none; }
    .joint { fill: #101214; stroke: #F5F5F0; stroke-width: 1.6; }
    .pin { fill: #D6A62E; }
    text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.1em; fill: #9DA3A6; }
    .gold { fill: #D6A62E; }
    @media (prefers-reduced-motion: no-preference) {
      .lower { transform-box: view-box; transform-origin: 280px 320px; animation: a 9s ease-in-out infinite; }
      .upper { transform-box: view-box; transform-origin: 320px 160px; animation: b 9s ease-in-out infinite; }
    }
    @keyframes a { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg); } }
    @keyframes b { 0%, 100% { transform: rotate(1.5deg); } 50% { transform: rotate(-1.5deg); } }
  </style>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F5F5F0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="520" fill="#191D20"/>
  <rect width="640" height="520" fill="url(#g)"/>

  <g transform="translate(40 20)">
    <line class="ln" x1="0" y1="470" x2="560" y2="470"/>
    <line class="dash" x1="0" y1="440" x2="560" y2="440"/>

    <!-- fixture table -->
    <rect class="body" x="410" y="300" width="150" height="12"/>
    <line class="ln" x1="428" y1="312" x2="428" y2="470"/>
    <line class="ln" x1="542" y1="312" x2="542" y2="470"/>
    <line class="thin" x1="428" y1="400" x2="542" y2="400"/>

    <!-- base -->
    <rect class="body" x="180" y="440" width="200" height="30"/>
    <rect class="body" x="226" y="372" width="108" height="68"/>
    <line class="thin" x1="226" y1="406" x2="334" y2="406"/>
    <rect class="body" x="218" y="332" width="124" height="40" rx="6"/>

    <!-- articulated arm (positions measured from the shoulder joint at 280,320) -->
    <g class="lower">
      <polygon class="body" points="258.7,314.7 301.3,325.3 336.5,164.1 303.5,155.9"/>
      <circle class="joint" cx="280" cy="320" r="30"/>
      <circle class="pin" cx="280" cy="320" r="5"/>
      <g class="upper">
        <polygon class="body" points="319,143 484.3,138 485.7,162 321,177"/>
        <circle class="joint" cx="320" cy="160" r="26"/>
        <circle class="pin" cx="320" cy="160" r="5"/>
        <circle class="joint" cx="485" cy="150" r="16"/>
        <rect class="body" x="473" y="160" width="24" height="46" rx="4"/>
        <rect class="body" x="469" y="206" width="32" height="10"/>
        <rect class="body" x="475" y="216" width="20" height="22"/>
        <line class="ln" x1="477" y1="238" x2="477" y2="264"/>
        <line class="ln" x1="493" y1="238" x2="493" y2="264"/>
        <circle class="pin" cx="485" cy="264" r="4.5"/>
      </g>
    </g>

    <!-- workpiece -->
    <rect class="body" x="466" y="268" width="38" height="32"/>
    <line class="thin" x1="466" y1="278" x2="504" y2="278"/>

    <!-- annotations -->
    <line class="dash" x1="280" y1="320" x2="40" y2="320"/>
    <line class="dash" x1="320" y1="160" x2="40" y2="160"/>
    <line class="dash" x1="485" y1="264" x2="485" y2="440"/>
    <text x="0" y="316">J2</text>
    <text x="0" y="156">J3</text>
    <text class="gold" x="396" y="430">TCP</text>
    <line class="thin" x1="394" y1="426" x2="479" y2="270"/>
    <text x="208" y="494">J1</text>
  </g>
</svg>
